# プロフィール README の画像(統計カード・草を食べるヘビ)を1日1回作り直して profile/ に置く
name: profile

on:
  schedule:
    - cron: "0 18 * * *" # 日本時間 3:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 公開リポジトリだけを数える(PAT も非公開の数を足す設定も使わない)
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=koubeyapurin&show_icons=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: koubeyapurin
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      # 上のどれかが失敗したらここまで来ないので、前の日の画像が残る
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "プロフィールの画像を更新"
          git pull --rebase
          git push
